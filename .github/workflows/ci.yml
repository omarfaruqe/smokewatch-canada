name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install
        run: uv venv && uv pip install -e ".[dev,api]"
      - name: Ruff
        run: .venv/bin/ruff check src tests
      - name: Pytest
        run: .venv/bin/pytest -q

  dbt:
    name: dbt build on fixtures and Dagster definitions
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: smokewatch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: smokewatch
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U smokewatch -d smokewatch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: smokewatch
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: smokewatch
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv venv && uv pip install -e ".[dbt,orchestration]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: dbt debug (connection and project)
        run: dbt debug --project-dir transform --profiles-dir transform
      - name: dbt parse
        run: dbt parse --project-dir transform --profiles-dir transform
      - name: dbt build on fixture data (all models and data tests)
        run: scripts/ci_dbt_fixture_build.sh
      - name: Dagster definitions load (uses the dbt manifest)
        run: dagster definitions validate -m smokewatch.orchestration.definitions
      - name: Generate dbt docs (single static page)
        run: |
          dbt docs generate --project-dir transform --profiles-dir transform --static
          mkdir -p site && cp transform/target/static_index.html site/index.html
      - name: Upload docs for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  docs:
    name: Publish dbt docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dbt
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
