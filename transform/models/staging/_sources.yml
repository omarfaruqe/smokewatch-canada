version: 2

sources:
  - name: raw
    schema: raw
    description: Bronze data loaded as-is by `smokewatch load` (jsonb properties + PostGIS geom).
    tables:
      - name: cwfis_hotspots
        description: CWFIS satellite hotspots (North America), both 24 h and season layers.
      - name: cwfis_fire_perimeters
        description: Daily snapshots of CWFIS current fire perimeters (M3 polygons, North America).
      - name: cwfis_season_perimeters
        description: CWFIS final perimeters of past seasons (archive), EPSG:3978.
      - name: eccc_aqhi_observations
        description: ECCC hourly AQHI observations.
      - name: eccc_aqhi_forecasts
        description: ECCC AQHI forecasts (hourly and named-period records).
      - name: eccc_climate_hourly
        description: ECCC hourly climate observations for all stations.
      - name: naps_hourly
        description: NAPS continuous hourly archive, one row per pollutant x method x station x local date (h01..h24 text).
      - name: naps_stations
        description: NAPS station list (all text).
      - name: statcan_census_divisions
        description: 2021 census division cartographic boundaries, EPSG:3347.
      - name: statcan_provinces
        description: 2021 province/territory cartographic boundaries, EPSG:3347.
      - name: statcan_population_cd
        description: Table 98-10-0007-01, population and dwelling counts (all values text).
      - name: _load_log
        description: One row per loaded bronze partition with its sha256.
