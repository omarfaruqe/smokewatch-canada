version: 2

models:
  - name: dim_census_division
    description: 2021 census divisions with province attributes, population, analysis and display geometry.
    columns:
      - name: cduid
        data_tests: [unique, not_null]
      - name: province_code
        data_tests: [not_null]
      - name: geom_4326
        data_tests: [valid_geometry]

  - name: int_location_census_division
    description: AQHI communities and weather stations mapped to their (nearest) census division.
    data_tests:
      - unique:
          column_name: "point_type || '|' || point_id"
    columns:
      - name: cduid
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_census_division')
                field: cduid

  - name: int_naps_station_hourly
    description: One row per NAPS station per UTC hour (PM2.5, O3, NO2), best method per pollutant.
    data_tests:
      - unique:
          column_name: "naps_id || '|' || observed_at::text"

  - name: int_naps_aqhi_hourly
    description: AQHI computed from NAPS 3-hour rolling means (Health Canada formula).
    data_tests:
      - unique:
          column_name: "naps_id || '|' || observed_at::text"
    columns:
      - name: aqhi
        data_tests: [not_null, non_negative]

  - name: int_aqhi_locations
    description: All AQHI-reporting locations (ECCC observed, NAPS computed) as points.
    data_tests:
      - unique:
          column_name: "aqhi_source || '|' || location_id"

  - name: int_da_aqhi_location
    description: Nearest AQHI location per source for each dissemination area, within the cap.
    data_tests:
      - unique:
          column_name: "dauid || '|' || aqhi_source"

  - name: int_first_nation_aqhi_location
    description: Census division and nearest AQHI location per source for each First Nation.
    data_tests:
      - unique:
          column_name: "band_number::text || '|' || aqhi_source"
    columns:
      - name: cduid
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_census_division')
                field: cduid

  - name: fct_first_nation_daily_exposure
    description: >
      First Nation x UTC day air quality at the nearest AQHI location (either source, within
      the cap). Locations are band office points, so this is an approximate indicator.
    data_tests:
      - unique:
          column_name: "band_number::text || '|' || day::text"
    columns:
      - name: high_risk_hours
        data_tests: [non_negative]

  - name: fct_hotspots
    description: Canadian satellite hotspots, one per detection, with census division.
    columns:
      - name: hotspot_id
        data_tests: [unique, not_null]
      - name: cduid
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_census_division')
                field: cduid

  - name: fct_aqhi_hourly
    description: Hourly AQHI (ECCC observed + NAPS computed) with census division and risk category.
    data_tests:
      - unique:
          column_name: "location_id || '|' || observed_at::text"
    columns:
      - name: risk_category
        data_tests:
          - accepted_values:
              arguments:
                values: ["low", "moderate", "high", "very_high"]
      - name: aqhi_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["eccc_observed", "naps_computed"]

  - name: fct_daily_exposure
    description: Census division x UTC day fire activity, air quality and population exposure.
    data_tests:
      - unique:
          column_name: "cduid || '|' || day::text"
    columns:
      - name: population_exposed_high_risk
        data_tests: [non_negative]
      - name: population_exposed_high_risk_da
        data_tests: [non_negative]
      - name: seniors_exposed_high_risk_da
        data_tests: [non_negative]
      - name: children_exposed_high_risk_da
        data_tests: [non_negative]
      - name: indigenous_exposed_high_risk_da
        data_tests: [non_negative]

  - name: dim_fire_perimeter_history
    description: >
      SCD Type 2 history of Canadian fire perimeters (valid_from inclusive, valid_to
      exclusive, null while current), derived from daily snapshots.
    data_tests:
      - unique:
          column_name: "perimeter_id || '|' || version::text"
    columns:
      - name: valid_from
        data_tests: [not_null]
      - name: cduid
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_census_division')
                field: cduid

  - name: fct_fire_season_perimeters
    description: Final perimeters of Canadian fires in archived seasons, with census division.
    data_tests:
      - unique:
          column_name: "season_year::text || '|' || perimeter_uid::text"
    columns:
      - name: area_ha
        data_tests: [not_null, non_negative]
      - name: active_days
        data_tests: [non_negative]

  - name: fct_pipeline_health
    description: >
      One row per dataset with load history (partitions, rows, last load) and the latest
      observation in the marts built from it. Served by the API as /health/pipeline.
    columns:
      - name: dataset
        data_tests: [unique, not_null]
      - name: rows_loaded
        data_tests: [non_negative]

  - name: fct_aqhi_forecast_pairs
    description: ECCC hourly AQHI forecasts matched with observations for the same location and hour.
    data_tests:
      - unique:
          column_name: "forecast_id"
    columns:
      - name: lead_hours
        data_tests: [not_null]
      - name: lead_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: ["00-06h", "06-12h", "12-24h", "24-48h", "48h+"]

  - name: fct_aqhi_forecast_skill
    description: AQHI forecast accuracy by lead time (MAE, bias, share within 1, POD, FAR).
    columns:
      - name: lead_bucket
        data_tests: [unique, not_null]
      - name: mae
        data_tests: [non_negative]
