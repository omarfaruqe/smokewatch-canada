name: smokewatch
version: "0.1.0"
config-version: 2
profile: smokewatch

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  smokewatch:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  smokewatch:
    +schema: reference
    province_codes:
      +column_types:
        pruid: text
        postal_code: text
