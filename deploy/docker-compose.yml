# Server deployment (snapshot mode): Postgres + PostGIS holding the `marts` schema, and the API
# with the dashboard. Both bind to 127.0.0.1 only; the gateway Caddy publishes /smokewatch/.
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: smokewatch

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - smokewatch_pgdata:/var/lib/postgresql/data
      - ./snapshot:/snapshot:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      API_ROOT_PATH: /smokewatch
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8095}:8000"

volumes:
  smokewatch_pgdata:
