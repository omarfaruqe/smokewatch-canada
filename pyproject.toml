[project]
name = "smokewatch"
version = "0.1.0"
description = "SmokeWatch Canada: national wildfire and air-quality data platform"
readme = "README.md"
requires-python = ">=3.10,<3.14"  # dagster-dbt does not support 3.14 yet
authors = [{ name = "Md Omar Faruqe", email = "faruqe@ru.ac.bd" }]
dependencies = [
  "requests>=2.31",
  "boto3>=1.34",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "geopandas>=1.0",
  "pyogrio>=0.10",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
dbt = ["dbt-core==1.12.6", "dbt-postgres==1.11.0"]
api = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2"]
orchestration = [
  "dagster==1.13.29",
  "dagster-webserver==1.13.29",
  "dagster-dbt==0.29.29",
]

[project.scripts]
smokewatch = "smokewatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "smokewatch.orchestration.definitions"
code_location_name = "smokewatch"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
