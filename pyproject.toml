[project]
name = "smokewatch"
version = "0.1.0"
description = "SmokeWatch Canada: national wildfire and air-quality data platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Md Omar Faruqe", email = "faruqe@ru.ac.bd" }]
dependencies = [
  "requests>=2.31",
  "boto3>=1.34",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
