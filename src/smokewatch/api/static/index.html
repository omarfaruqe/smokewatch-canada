<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmokeWatch Canada</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --bg:#f7f6f3; --panel:#ffffff; --ink:#1d2329; --muted:#5f6b76; --line:#e2e0db; --accent:#b8401c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { height:56px; display:flex; align-items:center; gap:16px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:18px; margin:0; letter-spacing:.2px; }
  header h1 span { color:var(--accent); }
  header .sub { color:var(--muted); font-size:13px; }
  header .spacer { flex:1; }
  button, select { font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 10px; cursor:pointer; }
  main { display:grid; grid-template-columns: 1fr 360px; height: calc(100% - 56px); }
  #map { height:100%; }
  aside { border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .controls input[type=range] { flex:1; min-width:140px; }
  .date { font-size:20px; font-weight:600; }
  .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:8px; }
  .stat b { display:block; font-size:18px; }
  .stat small { color:var(--muted); font-size:11px; }
  .layers label { display:block; font-size:13px; margin:3px 0; }
  .legend { display:flex; gap:2px; align-items:stretch; font-size:10px; }
  .legend div { flex:1; text-align:center; padding:3px 0; color:#fff; text-shadow:0 0 2px #0006; }
  .note { font-size:11.5px; color:var(--muted); line-height:1.45; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 6px; }
  .maplibregl-popup-content { font-size:12.5px; line-height:1.45; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 55% 45%; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Smoke<span>Watch</span> Canada</h1>
  <div class="sub" data-i18n="tagline"></div>
  <div class="spacer"></div>
  <button id="lang">FR</button>
</header>
<main>
  <div id="map"></div>
  <aside>
    <div>
      <div class="controls">
        <select id="season"></select>
        <button id="play">▶</button>
      </div>
      <div class="controls" style="margin-top:8px">
        <input id="slider" type="range" min="0" max="0" value="0">
      </div>
      <div class="date" id="dateLabel">–</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sExposed">–</b><small data-i18n="exposed"></small></div>
      <div class="stat"><b id="sHotspots">–</b><small data-i18n="hotspots"></small></div>
      <div class="stat"><b id="sAqhi">–</b><small data-i18n="peakAqhi"></small></div>
    </div>
    <div>
      <h2 data-i18n="seasonChart"></h2>
      <canvas id="chart" height="150"></canvas>
    </div>
    <div class="layers">
      <h2 data-i18n="layers"></h2>
      <label><input type="checkbox" id="lyrAqhi" checked> <span data-i18n="lyrAqhi"></span></label>
      <label><input type="checkbox" id="lyrHot" checked> <span data-i18n="lyrHot"></span></label>
      <label><input type="checkbox" id="lyrPerim"> <span data-i18n="lyrPerim"></span></label>
    </div>
    <div>
      <h2 data-i18n="legend"></h2>
      <div class="legend" id="legend"></div>
    </div>
    <p class="note" data-i18n="method"></p>
    <p class="note" data-i18n="sources"></p>
  </aside>
</main>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const T = {
  en: {
    tagline: "Wildfires, smoke and population exposure across Canada",
    exposed: "people in divisions with high-risk air", hotspots: "satellite hotspots", peakAqhi: "peak AQHI",
    seasonChart: "Population exposed (millions)", layers: "Layers", legend: "Daily peak AQHI",
    lyrAqhi: "Census divisions by peak AQHI", lyrHot: "Satellite hotspots", lyrPerim: "2023 final fire perimeters",
    noData: "no AQHI station", pop: "Population (2021)", fires: "Hotspots", hours: "High-risk hours",
    pm25: "PM2.5 daily mean (max station)", exposedPop: "Counted as exposed",
    season2023: "2023 fire season", recent: "Recent days",
    method: "Exposure is estimated per 2021 census division: if any AQHI location in a division had a high-risk hour (rounded AQHI 7+) that UTC day, its whole population is counted. Totals are upper bounds. 2023 AQHI is computed from NAPS measurements with Health Canada's formula; recent AQHI is ECCC's published value.",
    sources: "Data: Natural Resources Canada (CWFIS), Environment and Climate Change Canada (AQHI, NAPS, climate), Statistics Canada (2021 Census). Open Government Licence – Canada.",
  },
  fr: {
    tagline: "Feux de forêt, fumée et exposition de la population au Canada",
    exposed: "personnes dans des divisions à risque élevé", hotspots: "points chauds satellitaires", peakAqhi: "CAS maximale",
    seasonChart: "Population exposée (millions)", layers: "Couches", legend: "Cote air santé (CAS) maximale du jour",
    lyrAqhi: "Divisions de recensement selon la CAS", lyrHot: "Points chauds satellitaires", lyrPerim: "Périmètres finaux des feux 2023",
    noData: "aucune station CAS", pop: "Population (2021)", fires: "Points chauds", hours: "Heures à risque élevé",
    pm25: "PM2,5 moyenne quotidienne (station max.)", exposedPop: "Comptée comme exposée",
    season2023: "Saison des feux 2023", recent: "Jours récents",
    method: "L'exposition est estimée par division de recensement 2021 : si un lieu de mesure de la CAS d'une division a connu une heure à risque élevé (CAS arrondie de 7 ou plus) ce jour-là (UTC), toute sa population est comptée. Les totaux sont des bornes supérieures. La CAS de 2023 est calculée à partir des mesures du SNPA selon la formule de Santé Canada; la CAS récente est la valeur publiée par ECCC.",
    sources: "Données : Ressources naturelles Canada (SCIFV), Environnement et Changement climatique Canada (CAS, SNPA, climat), Statistique Canada (Recensement de 2021). Licence du gouvernement ouvert – Canada.",
  },
};
// Official AQHI colour scale (1..10, 10+)
const AQHI_COLORS = ["#00ccff","#0099cc","#006699","#ffff00","#ffcc00","#ff9933","#ff6666","#ff0000","#cc0000","#990000","#660000"];
let lang = "en", days = [], idx = 0, timer = null, chart = null, exposureByDay = {}, perimLoaded = false;
const fmt = (n, d=0) => n == null ? "–" : Number(n).toLocaleString(lang === "fr" ? "fr-CA" : "en-CA", {maximumFractionDigits:d});
const iso = d => d.toISOString().slice(0, 10);
const t = k => T[lang][k];

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.getElementById("lang").textContent = lang === "en" ? "FR" : "EN";
  const s = document.getElementById("season");
  s.options[0].text = t("season2023"); s.options[1].text = t("recent");
  if (chart) { chart.data.datasets[0].label = t("seasonChart"); chart.update(); }
  if (days.length) showDay(idx, false);
}

function buildLegend() {
  document.getElementById("legend").innerHTML = AQHI_COLORS.map((c, i) =>
    `<div style="background:${c}">${i === 10 ? "10+" : i + 1}</div>`).join("");
}

function rangeDays(a, b) {
  const out = []; for (let d = new Date(a + "T00:00:00Z"); iso(d) <= b; d.setUTCDate(d.getUTCDate() + 1)) out.push(iso(d));
  return out;
}

async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + " " + r.status); return r.json(); }

const map = new maplibregl.Map({
  container: "map", style: "https://tiles.openfreemap.org/styles/positron",
  center: [-96, 58], zoom: 2.6, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");

map.on("load", async () => {
  const empty = { type: "FeatureCollection", features: [] };
  map.addSource("cd", { type: "geojson", data: empty });
  map.addSource("hot", { type: "geojson", data: empty });
  map.addSource("perim", { type: "geojson", data: empty });
  const aqhiColor = ["case", ["==", ["get", "max_aqhi"], null], "rgba(0,0,0,0)",
    ["step", ["round", ["get", "max_aqhi"]], AQHI_COLORS[0], 2, AQHI_COLORS[1], 3, AQHI_COLORS[2], 4, AQHI_COLORS[3],
      5, AQHI_COLORS[4], 6, AQHI_COLORS[5], 7, AQHI_COLORS[6], 8, AQHI_COLORS[7], 9, AQHI_COLORS[8], 10, AQHI_COLORS[9], 11, AQHI_COLORS[10]]];
  map.addLayer({ id: "cd-fill", type: "fill", source: "cd", paint: { "fill-color": aqhiColor, "fill-opacity": 0.6 } });
  map.addLayer({ id: "cd-line", type: "line", source: "cd", paint: { "line-color": "#6b6b6b", "line-width": 0.3, "line-opacity": 0.5 } });
  map.addLayer({ id: "perim-line", type: "line", source: "perim", layout: { visibility: "none" },
    paint: { "line-color": "#7a1f0a", "line-width": 1 } });
  map.addLayer({ id: "hot-pts", type: "circle", source: "hot", paint: {
    "circle-radius": ["interpolate", ["linear"], ["zoom"], 3, 1.2, 8, 3.5],
    "circle-color": "#e8590c", "circle-opacity": 0.75 } });

  map.on("click", "cd-fill", e => {
    const p = e.features[0].properties;
    const prov = lang === "fr" ? p.province_name_fr : p.province_name_en;
    const aq = p.max_aqhi === undefined || p.max_aqhi === null || p.max_aqhi === "null"
      ? `<i>${t("noData")}</i>` : fmt(p.max_aqhi, 1);
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
      `<b>${p.name}</b>, ${prov}<br>${t("peakAqhi")}: ${aq}<br>${t("hours")}: ${fmt(p.high_risk_hours)}` +
      `<br>${t("pm25")}: ${p.pm25 && p.pm25 !== "null" ? fmt(p.pm25, 1) + " µg/m³" : "–"}` +
      `<br>${t("fires")}: ${fmt(p.hotspots)}<br>${t("pop")}: ${fmt(p.population)}` +
      `<br>${t("exposedPop")}: ${fmt(p.exposed)}`).addTo(map);
  });
  map.on("mouseenter", "cd-fill", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "cd-fill", () => map.getCanvas().style.cursor = "");

  const toggle = (box, layers) => document.getElementById(box).addEventListener("change", e =>
    layers.forEach(l => map.setLayoutProperty(l, "visibility", e.target.checked ? "visible" : "none")));
  toggle("lyrAqhi", ["cd-fill"]); toggle("lyrHot", ["hot-pts"]);
  document.getElementById("lyrPerim").addEventListener("change", async e => {
    if (e.target.checked && !perimLoaded) {
      map.getSource("perim").setData(await getJSON("/geo/fires/season/2023"));
      perimLoaded = true;
    }
    map.setLayoutProperty("perim-line", "visibility", e.target.checked ? "visible" : "none");
  });

  const health = await getJSON("/health");
  const recentStart = iso(new Date(Date.parse(health.coverage.aqhi_to) - 13 * 864e5));
  const seasons = { "2023": ["2023-05-01", "2023-09-30"], recent: [recentStart, health.coverage.aqhi_to] };
  const sel = document.getElementById("season");
  sel.innerHTML = `<option value="2023"></option><option value="recent"></option>`;
  sel.addEventListener("change", () => loadSeason(...seasons[sel.value]));
  applyLang();
  await loadSeason(...seasons["2023"], "2023-06-07");
});

async function loadSeason(start, end, focus) {
  stop();
  days = rangeDays(start, end);
  const daily = await getJSON(`/exposure/daily?start=${start}&end=${end}`);
  exposureByDay = Object.fromEntries(daily.map(d => [d.day, d]));
  const slider = document.getElementById("slider");
  slider.max = days.length - 1;
  drawChart();
  showDay(Math.max(0, days.indexOf(focus ?? days[0])));
}

function drawChart() {
  const data = days.map(d => (exposureByDay[d]?.population_exposed_high_risk ?? 0) / 1e6);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels: days.map(d => d.slice(5)), datasets: [{ label: t("seasonChart"), data,
      borderColor: "#b8401c", backgroundColor: "rgba(184,64,28,.12)", fill: true, pointRadius: 0, borderWidth: 1.5 }] },
    options: { animation: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { maxTicksLimit: 6 } }, y: { beginAtZero: true } },
      onClick: (_, els) => els.length && showDay(els[0].index) },
    plugins: [{ id: "cursor", afterDraw(c) {
      const x = c.scales.x.getPixelForValue(idx), { top, bottom } = c.chartArea, g = c.ctx;
      g.save(); g.strokeStyle = "#1d2329"; g.lineWidth = 1; g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.stroke(); g.restore();
    } }],
  });
}

let pending = 0;
async function showDay(i, fetchMap = true) {
  idx = i; const day = days[i]; const ticket = ++pending;
  document.getElementById("slider").value = i;
  document.getElementById("dateLabel").textContent =
    new Date(day + "T12:00:00Z").toLocaleDateString(lang === "fr" ? "fr-CA" : "en-CA", { weekday: "long", year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
  const s = exposureByDay[day] || {};
  document.getElementById("sExposed").textContent = s.population_exposed_high_risk ? fmt(s.population_exposed_high_risk / 1e6, 1) + " M" : "0";
  document.getElementById("sHotspots").textContent = fmt(s.hotspots ?? 0);
  document.getElementById("sAqhi").textContent = fmt(s.peak_aqhi, 1);
  if (chart) chart.draw();
  if (!fetchMap) return;
  const [cd, hot] = await Promise.all([
    getJSON(`/geo/census-divisions?date=${day}`), getJSON(`/geo/hotspots?date=${day}&limit=20000`)]);
  if (ticket !== pending) return;  // a newer day was requested meanwhile
  map.getSource("cd").setData(cd); map.getSource("hot").setData(hot);
}

function stop() { clearInterval(timer); timer = null; document.getElementById("play").textContent = "▶"; }
document.getElementById("play").addEventListener("click", () => {
  if (timer) return stop();
  document.getElementById("play").textContent = "❚❚";
  timer = setInterval(() => showDay(idx + 1 < days.length ? idx + 1 : 0), 1200);
});
document.getElementById("slider").addEventListener("input", e => showDay(Number(e.target.value)));
document.getElementById("lang").addEventListener("click", () => { lang = lang === "en" ? "fr" : "en"; applyLang(); });
buildLegend();
</script>
</body>
</html>
